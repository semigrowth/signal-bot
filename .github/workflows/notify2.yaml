name: Check Indicators for SPYTIPS COOL STRATEGY

on:
  schedule:
    # SELECT DAILY RUN TIME (UTC)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yahooquery pandas yfinance

      - name: run script
        run: |
          python3 main.py

      - name: Read content from file
        id: read_file
        run: |
          if [[ -f message.txt ]]; then
            echo "message.txt found, a notification will be sent."
          else
            echo "File message.txt not found. No changes to commit."
          fi

      - name: Send notification to Discord
        # Only run when main.py actually wrote a message (no-op on weekends /
        # holidays). Previously this step always ran and posted an empty body,
        # which Discord rejected with code 50006.
        if: hashFiles('message.txt') != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Build the JSON body with jq so multiline text and the "Error"
          # tracebacks that main.py writes are escaped correctly. Posting raw
          # interpolated text used to produce invalid JSON (Discord code 50109),
          # which is why crash reports never reached the channel.
          jq -n --rawfile content message.txt '{content: $content}' > payload.json
          curl -sS -X POST -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL"
      
      - name: Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history*.txt
          git commit -m "Update current indicator data [ci skip]" || exit 0
          git push origin main || git push origin main --set-upstream
